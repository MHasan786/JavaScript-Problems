<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculater</title>
    <style>
        h1 {
            text-align: center;
            color: black;
            text-transform: capitalize;
            font-weight: 800;
            font-size: 40px;
        }

        h3 {
            text-align: center;
            font-weight: 500;
            font-size: 25px;
        }
    </style>
</head>

<body>
    <h1>Calculater</h1>
    <h3></h3>

    <script>
        const num1 = parseFloat(prompt("Enter a first number: "));
        const num2 = parseFloat(prompt("Enter a second number: "));
        let symbol = prompt("Enter a operator: + - x / %: ");

        let calculater = (num1, num2) => {
            if (symbol === '+') {
                return num1 + num2;
            } else if (symbol === '-') {
                return num1 - num2;
            } else if (symbol === 'x') {
                return num1 * num2;
            } else if (symbol === '/') {
                if (num2 === 0) {
                    return "Error: Division by zero";
                }
                return num1 / num2;
            } else if (symbol === '%') {
                if (num2 === 0) {
                    return "Error: Division by zero";
                }
                return num1 % num2;
            } else {
                return "Error: Unsupported operation";
            }
        }

        let result = document.getElementsByTagName('h3')[0].innerHTML = calculater(num1, num2);
    </script>
</body>

</html>
