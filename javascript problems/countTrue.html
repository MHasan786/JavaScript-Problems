<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count True in an array</title>
    <style>
        body{
            background-color: black;
        }
        h1{
            color: blanchedalmond;
            text-align: center;
            font-size: 45px;
            text-transform: capitalize;
        }
        h2{
            text-align: center;
            font-size: 25px;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Count True in an Array</h1>
    <h2></h2>

    <script>
        function countTrue(arr){
            return arr.reduce((count,value)=> count+(value === true) ,0);
        }
        let arr = [true,false,true,true,false];
        let result = document.getElementsByTagName('h2')[0].innerHTML = countTrue(arr);
    </script>
</body>
</html>
